<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Shop</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="section-1"></div>
    <div id="section-2"></div>
    <div id="section-3"></div>
    <div id="section-4"></div>
    <div id="section-5"></div>

    <script>
      const sections = [
        { id: "section-1", file: "section1.html" },
        { id: "section-2", file: "sections/section2.html" },
        { id: "section-3", file: "section3.html" },
        { id: "section-4", file: "section4.html" },
        { id: "section-5", file: "sections/section5.html" },
      ];

      sections.forEach((sec) => {
        fetch(sec.file)
          .then((res) => res.text())
          .then((html) => {
            document.querySelector(`#${sec.id}`).innerHTML = html;
          })
          .catch((err) => console.error(`Error loading ${sec.file}:`, err));
      });
    </script>
  </body>
</html>
