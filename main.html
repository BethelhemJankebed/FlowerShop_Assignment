<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Merge</title>
  </head>
  <body>
    <div id="section1" class="section"></div>
    <div id="section2" class="section"></div>
    <div id="section3" class="section"></div>
    <div id="section4" class="section"></div>
    <div id="section5" class="section"></div>

    <script>
      const sections = [
        {
          id: "section1",
          html: "section1new.html",
          css: "section1new.css",
        },
        {
          id: "section2",
          html: "sections/section2.html",
          css: "sections/section2.css",
        },
        {
          id: "section3",
          html: "Section3Senait.html",
          css: "Section3Senait.css",
        },
        {
          id: "section4",
          html: "section4starr.html",
          css: "section4starr.css",
        },
      ];

      sections.forEach((sec) => {
        // Fetch and insert HTML
        fetch(sec.html)
          .then((res) => res.text())
          .then((html) => {
            const container = document.getElementById(sec.id);
            container.innerHTML = html;

            // Prefix all CSS rules with the section ID to prevent conflicts
            fetch(sec.css)
              .then((res) => res.text())
              .then((css) => {
                const scopedCss = css.replace(
                  /(^|\})\s*([^{]+)/g,
                  (match, brace, selector) => {
                    // prefix each selector with #sectionID
                    return `${brace} #${sec.id} ${selector.trim()}`;
                  }
                );
                const style = document.createElement("style");
                style.textContent = scopedCss;
                document.head.appendChild(style);
              })
              .catch((err) =>
                console.warn(`CSS not found for ${sec.id}:`, err)
              );
          })
          .catch((err) =>
            console.error(`Failed to load HTML for ${sec.id}:`, err)
          );
      });
    </script>
  </body>
</html>
